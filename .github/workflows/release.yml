name: Release Windows

# Runs only for explicit version tags (v1.1.0, v1.2.0, ...). Ordinary pushes never publish.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag must match package.json version
        shell: bash
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "v$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version v$pkg" >&2
            exit 1
          fi
      - run: npx tsc --noEmit

  publish:
    needs: validate
    runs-on: windows-latest
    environment: release # add required reviewers on this environment for a manual approval gate
    permissions:
      contents: write # create the release and upload assets with the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # electron-builder uploads the installer and blockmap concurrently and each upload creates its own
      # GitHub release when none exists (duplicate v1.1.0 releases). Creating the release first means every
      # upload finds and reuses this one.
      - name: Create the release once
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --verify-tag --notes "Murlidhar Enterprise ${GITHUB_REF_NAME#v}"
      - name: Build and publish installer + latest.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run desktop:release
      - name: Verify a single complete release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")] | length")"
          if [ "$count" != "1" ]; then echo "Expected 1 release for $GITHUB_REF_NAME, found $count" >&2; exit 1; fi
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          echo "$assets"
          for pattern in 'Setup-.*\.exe$' 'Setup-.*\.exe\.blockmap$' '^latest\.yml$'; do
            echo "$assets" | grep -Eq "$pattern" || { echo "Missing asset matching $pattern" >&2; exit 1; }
          done
      - name: Record build
        shell: bash
        run: echo "Published $GITHUB_REF_NAME from $GITHUB_SHA (run $GITHUB_RUN_ID)" >> "$GITHUB_STEP_SUMMARY"
